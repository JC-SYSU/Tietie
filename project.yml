name: Tietie
options:
  bundleIdPrefix: cn.tietie
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  TietieCore:
    path: TietieCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.0
targets:
  Tietie:
    type: application
    platform: macOS
    sources:
      - Tietie
      - Tietie/Assets.xcassets
      # Icon Composer 的分层图标包: 整个目录作为 folder reference 加入,
      # actool 读取 icon.json 和 Assets/ 下的 SVG 图层。
      - path: Tietie/Assets/Tietie-native.icon
        type: folder
    dependencies:
      - package: TietieCore
      - package: KeyboardShortcuts
    scheme:
      testTargets: []
    info:
      path: Tietie/Info.plist
      properties:
        CFBundleDisplayName: 贴贴
        # 界面语言：没有这一项，macOS 不会把 app 当作支持中文，界面会退回英文。
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        # 上游署名保留 (GPL-3.0 §5(a)、§7(b) 与 NOTICE); 修改声明追加在后。
        # 本地 fork 未启用自动更新: 没有自己的 appcast 和 EdDSA 私钥,
        # 不能指向 tarikbc.github.io/Copy/appcast.xml。
        NSHumanReadableCopyright: "© 2026 Tarik Caramanico - GPL-3.0; modifications © 2026 Tietie contributors"
        # Declares the internal card-drag payload type (see ShelfViewModel.UTType.copyItem)
        # so the system recognizes it during real drag-and-drop, not just as an in-process
        # string constant. Required for card → pinboard tab filing to work.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: cn.tietie.app.item
            UTTypeDescription: 贴贴 clipboard item
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: cn.tietie.app.pinboard
            UTTypeDescription: 贴贴 pinboard
            UTTypeConformsTo:
              - public.data
    settings:
      base:
        PRODUCT_NAME: Tietie
        PRODUCT_BUNDLE_IDENTIFIER: cn.tietie.app
        MARKETING_VERSION: "0.0.1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        # 无 Apple Developer 账号: ad-hoc 签名。用户下载后需右键打开或清除 quarantine。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: Tietie-native
