name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # TietieCore/Package.resolved answers to two tools. `xcodebuild` writes all three
      # pins into it, because TietieCore is the workspace's root package and the generated
      # .xcodeproj is gitignored, so Xcode has nowhere else to keep them. `swift test
      # --package-path TietieCore` resolves TietieCore on its own and rewrites the same file
      # with GRDB alone. So running the tests before committing silently drops the
      # KeyboardShortcuts pin, and the next build would resolve it to whatever `from:`
      # allows. This runs before the tests, so it reads what was committed.
      - name: Check the SPM pins survived
        run: |
          missing=0
          for dep in grdb.swift keyboardshortcuts; do
            jq -e --arg d "$dep" '.pins | map(.identity) | index($d)' \
              TietieCore/Package.resolved >/dev/null 2>&1 || {
              echo "::error file=TietieCore/Package.resolved::no pin for $dep"
              missing=1
            }
          done
          if [ "$missing" = 1 ]; then
            echo "Restore them with: xcodegen generate && xcodebuild -project Tietie.xcodeproj -scheme Tietie -configuration Debug build"
            echo "then commit TietieCore/Package.resolved again."
            exit 1
          fi
          echo "grdb.swift and keyboardshortcuts are pinned."

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Core tests
        run: swift test --package-path TietieCore
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Tietie.xcodeproj -scheme Tietie -configuration Debug CODE_SIGNING_ALLOWED=NO build
